# PROTOTYPE — CUBRIDQA-1503 / S4.  THROWAWAY.  답이 티켓에 들어가면 지운다.
#
# 질문 셋을 한 번의 dispatch 로 답한다.
#
#   Q4-1. secret 을 쓰는 job 과 비신뢰 코드를 도는 job 이 정말 서로 다른 ephemeral
#         러너에 올라가는가. 앞 job 의 흔적이 뒤 job 에 남지 않는가.
#   Q4-2. 러너 job hook 이 도는가. 이벤트 이름을 보는가. (거부는 별도 run 으로 시험한다)
#   Q4-3. 입력 SHA 의 워크플로가 아니라 default branch 판이 도는가.
#
# 두는 곳: fork(tw-kang/cubrid)의 *기본 브랜치* `cubridqa-1503` 의
#   .github/workflows/poc-s4.yml. workflow_dispatch 는 기본 브랜치 판만 실행한다 (4-5).
#
# 실행:
#   gh workflow run poc-s4.yml --repo tw-kang/cubrid -f sha=<40자 SHA>
#   sha 는 `poc-s4-untrusted` 브랜치의 head 를 준다. 그 브랜치에는 변조된
#   .github/workflows/poc-s4.yml 이 들어 있다 (PROTOTYPE-s4-decoy-workflow.yml).
#
# --- 설계 근거 (Q2 조사 11-2) ---
# dispatch 전용 구조는 트리거 경로만 막는다. maintainer 가 fork PR 의 head SHA 를
# 수동 dispatch 하면 러너에서 비신뢰 코드가 도는 상황은 그대로다. 그래서 방어선은
# 워크플로 설계 쪽에 있다. 네 가지를 여기서 실증한다.
#   1. 입력은 전체 40자 SHA 다. PR 번호는 dispatch 이후에도 head 가 바뀐다.
#   2. 신뢰 코드는 default branch 에서 읽고, 검사 대상만 그 SHA 로 가져온다.
#   3. secret job 과 비신뢰 실행 job 을 나눈다. 같은 러너에 올리면 의미가 없다.
#   4. 러너 job hook 으로 이중 강제한다.

name: poc-s4

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "검사 대상 40자 커밋 SHA (tw-kang/cubrid)"
        required: true
        type: string

# 기본은 아무 권한도 주지 않는다. 필요한 job 에서만 최소로 연다.
# 이 저장소의 default_workflow_permissions 는 write 다 (2026-08-11 API 확인).
# 워크플로에서 닫지 않으면 열린 채로 돈다.
permissions: {}

jobs:
  # =====================================================================
  # job A — 신뢰 구역. secret 을 만지는 쪽이다.
  # container 를 주지 않는다. 러너 pod 안에서 직접 돈다.
  # =====================================================================
  trusted-secret:
    name: A. 신뢰 구역 (secret 을 만진다)
    runs-on: cubridqa-1503-poc
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      runner_name: ${{ steps.id.outputs.runner_name }}
      hostname: ${{ steps.id.outputs.hostname }}
      marker: ${{ steps.id.outputs.marker }}

    steps:
      - name: A1. 신원과 secret 주입 확인
        id: id
        env:
          # 값 자체는 어디에도 찍지 않는다. 주입 여부와 해시 앞 8자만 본다.
          CANARY: ${{ secrets.POC_S4_CANARY }}
        run: |
          set -eo pipefail
          echo "=== 이 job 이 어디서 도나 ==="
          echo "러너      : ${RUNNER_NAME:-(없음)}"
          echo "hostname  : $(hostname)"
          echo "uid/gid   : $(id)"
          echo "workspace : $GITHUB_WORKSPACE"
          echo "workflowRef: ${GITHUB_WORKFLOW_REF:-(없음)}"

          echo "=== secret 이 이 job 에 들어왔나 ==="
          if [ -z "${CANARY:-}" ]; then
            echo "::error::secret POC_S4_CANARY 가 비어 있다. 저장소 secret 을 먼저 만들어라"
            exit 1
          fi
          # 길이와 해시 앞 8자만 남긴다. 이것으로 job B 와 대조한다.
          h=$(printf '%s' "$CANARY" | sha256sum | cut -c1-8)
          echo "주입됨    : 예 (길이 ${#CANARY}, sha256 앞 8자 $h)"

          {
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "hostname=$(hostname)"
            echo "marker=$h"
          } >> "$GITHUB_OUTPUT"

      - name: A2. 러너 파일시스템에 흔적을 남긴다
        run: |
          set -eo pipefail
          # job B 가 이것을 찾을 수 있으면 러너가 재사용된 것이다.
          # 두 자리에 남긴다.
          #   1) 러너 홈 — 러너 pod 의 파일시스템
          #   2) work 볼륨 상위 — job pod 에도 마운트되는 PVC
          echo "poc-s4 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" \
            > "$HOME/.poc-s4-runner-marker"
          echo "poc-s4 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" \
            > "$GITHUB_WORKSPACE/../.poc-s4-work-marker"

          echo "=== 남긴 것 ==="
          ls -l "$HOME/.poc-s4-runner-marker" "$GITHUB_WORKSPACE/../.poc-s4-work-marker"
          echo "HOME       : $HOME"
          echo "work 상위  : $(cd "$GITHUB_WORKSPACE/.." && pwd)"

          echo "=== 이 러너가 ephemeral 인지 보이는 단서 ==="
          # ARC 는 --ephemeral 로 등록한다. .runner 에 그 값이 남는다.
          for f in /home/runner/.runner /actions-runner/.runner; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done || true

  # =====================================================================
  # job B — 비신뢰 구역. 입력받은 SHA 의 코드를 가져온다.
  # secrets 를 하나도 참조하지 않는다. 참조하지 않으면 주입되지 않는다.
  # =====================================================================
  untrusted-exec:
    name: B. 비신뢰 구역 (입력 SHA 를 가져온다)
    needs: trusted-secret
    runs-on: cubridqa-1503-poc
    timeout-minutes: 20
    # 권한을 명시적으로 비운다. 최상위에서 이미 비웠지만 여기서 다시 닫는다.
    permissions: {}

    container:
      image: cubridci/cubridci:rl8.10

    defaults:
      run:
        shell: bash

    env:
      BUILD_MIRROR: /home/build-cache/cubrid-mirror
      PREV_RUNNER: ${{ needs.trusted-secret.outputs.runner_name }}
      PREV_HOST: ${{ needs.trusted-secret.outputs.hostname }}
      PREV_MARKER: ${{ needs.trusted-secret.outputs.marker }}

    steps:
      - name: B1. Q4-1 — 앞 job 과 같은 러너인가
        run: |
          set -eo pipefail
          echo "=== 이 job 이 어디서 도나 ==="
          echo "러너      : ${RUNNER_NAME:-(없음)}"
          echo "hostname  : $(hostname)"
          echo "uid/gid   : $(id)"
          echo "workspace : $GITHUB_WORKSPACE"

          echo
          echo "=== 앞 job (A) 와 대조 ==="
          echo "A 의 러너   : $PREV_RUNNER"
          echo "B 의 러너   : ${RUNNER_NAME:-(없음)}"
          if [ "${RUNNER_NAME:-}" = "$PREV_RUNNER" ]; then
            echo "판정: ⚠ 같은 러너다 — ephemeral 이 성립하지 않는다"
          else
            echo "판정: 다른 러너다"
          fi
          echo "A 의 host   : $PREV_HOST"
          echo "B 의 host   : $(hostname)"

      - name: B2. Q4-1 — 앞 job 의 흔적이 남아 있나
        run: |
          set -eo pipefail
          found=0

          echo "=== work 볼륨 상위 ==="
          up=$(cd "$GITHUB_WORKSPACE/.." && pwd)
          echo "경로: $up"
          ls -Al "$up" || true
          if [ -f "$up/.poc-s4-work-marker" ]; then
            echo "⚠ 찾았다: $up/.poc-s4-work-marker"
            cat "$up/.poc-s4-work-marker"
            found=1
          else
            echo "없다 — work 볼륨이 새로 만들어졌다"
          fi

          echo
          echo "=== 러너 홈 흔적 (job container 에서는 애초에 안 보여야 정상) ==="
          for f in /home/runner/.poc-s4-runner-marker /root/.poc-s4-runner-marker; do
            if [ -f "$f" ]; then echo "⚠ 찾았다: $f"; cat "$f"; found=1; fi
          done
          [ "$found" -eq 0 ] && echo "없다"

          echo
          echo "=== 워크스페이스 안에 남은 것 ==="
          ls -Al "$GITHUB_WORKSPACE" || true

          echo
          echo "흔적 발견: $found (0 이면 격리 성립)"

      - name: B3. Q4-1 — secret 이 이 job 에 들어왔나
        run: |
          set -eo pipefail
          # 이 job 은 secrets 를 하나도 참조하지 않는다. 그러므로 주입되지 않아야 한다.
          echo "=== CANARY 라는 이름의 환경변수 ==="
          if env | grep -i canary; then
            echo "::error::⚠ 비신뢰 job 에 canary 가 들어왔다"
            exit 1
          fi
          echo "없다"

          echo
          echo "=== 앞 job 의 secret 해시가 환경에 있나 ==="
          if env | grep -q -- "$PREV_MARKER" 2>/dev/null; then
            echo "⚠ 해시가 환경에 있다"
          else
            echo "없다"
          fi

          echo
          echo "=== 이 job 이 받은 GITHUB_* 중 토큰류 ==="
          # 값은 찍지 않는다. 이름과 길이만 본다.
          env | grep -E '^(GITHUB|ACTIONS)_' | while IFS='=' read -r k v; do
            case "$k" in
              *TOKEN*|*SECRET*|*KEY*) echo "$k = (길이 ${#v})" ;;
              *) echo "$k = $v" ;;
            esac
          done

      - name: B4. Q4-3 — 무엇이 실행 중이고 무엇을 가져오는가
        env:
          # 입력을 ${{ }} 로 셸 본문에 박지 않는다. 본문에 박으면 입력이 셸 코드가 된다.
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -eo pipefail

          echo "=== 입력 SHA 검사 ==="
          # 전체 40자 소문자 hex 만 받는다. 짧은 SHA 도 ref 이름도 받지 않는다.
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha 는 소문자 40자 hex 여야 한다"
            exit 1
          fi
          echo "SHA: $INPUT_SHA"

          echo
          echo "=== 지금 도는 워크플로는 어느 ref 의 것인가 ==="
          # 이것이 Q4-3 의 핵심 증거다. default branch 판이어야 한다.
          echo "GITHUB_WORKFLOW_REF : ${GITHUB_WORKFLOW_REF:-(없음)}"
          echo "GITHUB_REF          : ${GITHUB_REF:-(없음)}"
          echo "GITHUB_SHA          : ${GITHUB_SHA:-(없음)}"
          echo "GITHUB_REF_NAME     : ${GITHUB_REF_NAME:-(없음)}"

          echo
          echo "=== 검사 대상 코드를 가져온다 ==="
          cd "$GITHUB_WORKSPACE"
          # job container 는 root, workspace 는 러너 uid(1001) 소유다.
          # git 이 dubious ownership 으로 저장소를 아예 열지 않는다. (S2 함정 5)
          chown root:root "$GITHUB_WORKSPACE"

          # 미러에서 이력을 빌리고 fork 의 그 SHA 만 증분으로 받는다.
          if [ -d "$BUILD_MIRROR/cubrid.git" ]; then
            git clone --quiet --shared --no-checkout "$BUILD_MIRROR/cubrid.git" .
          else
            echo "::error::미러가 안 보인다 — pod template 이 job pod 에 적용되지 않았다"
            exit 1
          fi
          git fetch --quiet https://github.com/tw-kang/cubrid.git "$INPUT_SHA"
          git checkout --quiet --detach "$INPUT_SHA"
          echo "HEAD: $(git rev-parse HEAD)"

          echo
          echo "=== 가져온 판의 워크플로 파일에 변조 표식이 있나 ==="
          f=.github/workflows/poc-s4.yml
          if [ ! -f "$f" ]; then
            echo "가져온 판에는 $f 가 없다"
          elif grep -q 'POC_S4_DECOY_MARKER' "$f"; then
            echo "있다 — 가져온 판은 변조된 판이다:"
            grep -n 'POC_S4_DECOY_MARKER' "$f"
            echo
            echo "그런데 지금 도는 것은 이 파일이 아니다. 위의 GITHUB_WORKFLOW_REF 를 보라."
            echo "판정: default branch 요건이 성립한다"
          else
            echo "없다 — 변조 표식이 없는 판을 가져왔다 (입력 SHA 를 잘못 준 것일 수 있다)"
          fi

      - name: B5. Q4-2 — job hook 이 무엇을 남겼나
        if: always()
        run: |
          set -eo pipefail
          # hook 은 러너 pod 에서 돈다. 그 로그는 job 로그의 "Set up job" 쪽에 나온다.
          # 여기서는 job container 에서 hook 관련 환경변수가 보이는지만 확인한다.
          echo "=== hook 관련 환경변수 (job container 에서) ==="
          env | grep -i 'HOOK' || echo "(없음 — job container 에는 안 넘어오는 것이 정상)"
