# CUBRIDQA-1519 — job 컨테이너 생명줄이 테스트의 kill 에 견디는지 본다.
#
# 버릴 코드다. 답이 티켓에 들어가면 지운다.
#
# 왜 필요한가:
#   ARC 훅은 job 컨테이너를 `tail -f /dev/null` 로 띄운다. shareProcessNamespace 때문에
#   PID 1 은 /pause 이고 그 tail 은 평범한 프로세스다. 테스트의 `xkill tail` 이 그것을
#   죽이면 컨테이너가 사라지고 남은 스텝이 전부 `cannot exec in a stopped state` 가 된다.
#   2026-08-14 run 31765117099 에서 shard 18·37 이 정확히 그렇게 죽었다.
#
# 무엇을 시험하나 (둘 다여야 한다):
#   A. 생명줄이 이름 기반 kill 에 안 죽는다      <- 새로 고친 것
#   B. 좀비가 여전히 회수된다                    <- S6 이 고친 것. 되돌아가면 안 된다
#
# 전제: ConfigMap cubridqa-1503-poc-pod-template 이 PROTOTYPE-1526-pod-template.yaml 판이어야 한다.
#
# 실행 (러너 1개면 된다):
#   gh workflow run poc-1526-keepalive.yml --repo tw-kang/cubrid
#
# 판정: 이 워크플로가 초록이면 고쳐진 것이다.
#   고치기 전 판으로 돌리면 "3. 죽여 본다" 다음 스텝이
#   `cannot exec in a stopped state` 로 죽는다 — 그것이 대조군이다.

name: poc-1526-keepalive

on:
  workflow_dispatch:
    inputs:
      expect:
        description: "survive = 살아남아야 한다(고친 판) / die = 죽어야 한다(옛 판 대조군)"
        required: false
        default: "survive"
        type: string

permissions:
  contents: read

jobs:
  keepalive:
    name: 생명줄 시험
    runs-on: cubridqa-1503-poc
    timeout-minutes: 15
    container:
      image: cubridci/cubridci:test_shell
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. 지금 무엇이 떠 있나
        id: facts
        run: |
          set -eo pipefail
          pid1=$(ps -p 1 -o comm= | tr -d ' ')
          echo "PID 1        : $pid1"
          echo "=== 컨테이너 안 프로세스 전부 ==="
          ps -eo pid,ppid,stat,comm
          echo
          # 생명줄은 PID 1 이 아니면서 pod 이 뜰 때부터 있던 프로세스다.
          # shellcheck disable=SC2009  # pgrep 이 아니라 ps 를 훑는 것이 의도다. CTP 의 xkill 과 같은 방식이어야 한다.
          keep=$(ps -eo pid,comm --no-headers | awk '$1 != 1 {print $2}' | grep -E 'arc-keepalive|^tail$|^sleep$' | head -1)
          echo "생명줄 이름  : ${keep:-(못 찾음)}"
          echo "pid1=$pid1" >> "$GITHUB_OUTPUT"
          echo "keep=${keep:-none}" >> "$GITHUB_OUTPUT"

          # PID 1 이 /pause 여야 좀비가 회수된다 (S6). 아니면 뒤 시험이 의미 없다.
          if [ "$pid1" != "pause" ]; then
            echo "::error::PID 1 이 pause 가 아니다 ($pid1). pod template 에 shareProcessNamespace 가 빠졌다."
            exit 1
          fi

      - name: 2. B — 좀비가 회수되는가 (S6 성질이 남아 있는지)
        run: |
          set -eo pipefail
          # 부모가 먼저 죽어 PID 1 로 재부모화되는 프로세스를 만든다.
          # CUBRID 서버가 데몬(double fork)이라 만드는 상황과 같은 모양이다.
          ( ( sleep 2 & ) & ) 2>/dev/null
          sleep 5
          # shellcheck disable=SC2009  # pgrep 은 좀비 상태를 못 센다. 함정 12 의 진단법이 이 두 줄이다.
          z=$(ps -eo stat= | grep -c '^Z' || true)
          echo "좀비 수: $z"
          ps -eo pid,ppid,stat,comm | awk 'NR==1 || $3 ~ /Z/'
          if [ "$z" -ne 0 ]; then
            echo "::error::좀비가 $z 개 남았다. PID 1 이 거두지 못한다 — S6 의 정지 문제가 되살아난다."
            exit 1
          fi
          echo "좀비 0 — 회수된다"

      - name: 3. A — 테스트가 하는 그대로 죽여 본다
        run: |
          set -eo pipefail
          # CTP init.sh 의 xkill 과 같은 로직이다 (comm 부분일치 + kill -9).
          #   pids=`ps -u $USER -o pid,comm | grep "$strkill" | grep -v grep | awk '{print $1}'`
          #   for pid in $pids; do kill -9 $pid; done
          xkill_like() {
            local want="$1" pids
            # shellcheck disable=SC2009  # pgrep 으로 바꾸면 시험이 무의미하다. xkill 은 ps 를 grep 한다.
            pids=$(ps -u root -o pid,comm | grep "$want" | grep -v grep | awk '{print $1}' || true)
            echo "  '$want' 로 잡힌 PID: ${pids:-(없음)}"
            for p in $pids; do
              [ "$p" = 1 ] && { echo "    PID 1 은 건너뛴다"; continue; }
              if kill -9 "$p" 2>/dev/null; then echo "    kill -9 $p"; fi
            done
          }

          echo "=== 죽이기 전 ==="
          ps -eo pid,ppid,stat,comm

          # 실제 케이스가 쓰는 두 인자다.
          #   xkill tail   : _35_cherry/.../cbrd_22477_unload  (2건)
          #   pkill sleep  : _01_utility/_38_csql/_enhance_csql03
          echo "=== xkill tail ==="
          xkill_like tail
          echo "=== pkill sleep ==="
          xkill_like sleep

          echo "=== 죽인 뒤 (이 스텝은 여기까지 온다) ==="
          ps -eo pid,ppid,stat,comm
          echo "이 줄이 보이면 스텝 자체는 끝났다. 진짜 판정은 다음 스텝이다."

      - name: 4. 살아남았는가 — 여기가 진짜 시험이다
        run: |
          set -eo pipefail
          # 컨테이너가 죽었다면 이 스텝은 실행조차 못 된다.
          # 훅이 `cannot exec in a stopped state` 로 실패한다 (shard 18·37 이 그랬다).
          echo "컨테이너가 살아 있다."
          echo "PID 1        : $(ps -p 1 -o comm= | tr -d ' ')"
          echo "남은 프로세스:"
          ps -eo pid,ppid,stat,comm

      - name: 5. 판정
        if: always()
        env:
          EXPECT: ${{ inputs.expect }}
          PID1: ${{ steps.facts.outputs.pid1 }}
          KEEP: ${{ steps.facts.outputs.keep }}
        run: |
          set -eo pipefail
          {
            echo "## CUBRIDQA-1519 — 생명줄 시험"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| PID 1 | \`$PID1\` |"
            echo "| 생명줄 | \`$KEEP\` |"
            echo "| 기대 | $EXPECT |"
            echo
            echo "여기까지 왔다는 것은 3번 스텝(kill) 뒤에도 컨테이너가 살아 있다는 뜻이다."
            echo "고치기 전 판(\`tail -f /dev/null\`)이면 4번 스텝이 \`cannot exec in a stopped state\` 로 죽는다."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

          if [ "$KEEP" = 'tail' ]; then
            echo "::warning::생명줄이 아직 tail 이다. pod template 이 옛 판이다."
          fi
