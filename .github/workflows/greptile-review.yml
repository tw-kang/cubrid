name: Greptile Review Trigger

on:
  pull_request:
    types: [opened]

permissions: {}

concurrency:
  group: greptile-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  comment-greptile:
    name: Trigger Greptile Review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Trigger Greptile via PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "@greptileai"
