# PROTOTYPE — CUBRIDQA-1503 / S3.  THROWAWAY.  답이 티켓에 들어가면 지운다.
#
# 질문 둘을 한 번의 dispatch 로 답한다.
#   1. CircleCI 의 노드 빌드(CUBRIDQA-1506, build-debug-node)가 GHA job 으로 그대로 도는가.
#      미러 clone -> SHA fetch -> 서브모듈 -> entrypoint build -> 원자적 발행.
#   2. run 당 WAN 사용량이 CircleCI 노드 빌드와 같은 수준인가.
#      1506 의 기준값: git 증분 약 2MB(미러 7일 낡음) + 3rdparty 약 17MB.
#
# 두는 곳: fork(tw-kang/cubrid)의 *기본 브랜치* `cubridqa-1503` 의
#   .github/workflows/poc-s3.yml. workflow_dispatch 는 기본 브랜치의 워크플로만 실행한다.
#
# 실행:
#   gh workflow run poc-s3.yml --repo tw-kang/cubrid -f sha=<40자 SHA>
#
# --- CircleCI 와 일부러 다르게 한 것 ---
#
# 1. 액션을 하나도 쓰지 않는다. actions/checkout 도 안 쓴다.
#    액션을 쓰면 러너 pod 가 그 tarball 을 GitHub 에서 받는다. 그 바이트는 job pod 의
#    카운터에 안 잡히면서 WAN 은 실제로 쓴다. 측정을 흐리지 않으려고 전부 run 스텝이다.
#    빌드에 필요한 것도 아니다 — 소스는 미러에서 온다.
#
# 2. 발행 대상이 운영 경로가 아니다.
#    CircleCI 는 /home/build-cache/builds/<sha>/debug 에 발행하고 test_shell 이 그것을 먹는다.
#    PoC 가 거기에 쓰면 운영 shell 테스트가 PoC 산출물을 소비할 수 있다.
#    그래서 /home/build-cache/poc-1503/builds/<sha>/debug 에 쓴다. 정리는 이 한 디렉토리다.
#
# 3. ccache 는 운영과 같은 디렉토리를 쓴다 (읽고 쓴다).
#    빌드 시간을 1506 의 실측(warm 285초, 적중률 59.77%)과 나란히 놓으려면 같은 캐시라야 한다.
#    같은 이미지·같은 컴파일러·같은 SHA 이므로 들어가는 항목이 CircleCI 것과 같다.
#    영향은 CircleCI run 한 번이 더 도는 것과 같다.
#    다만 `ccache -z` 는 공유 통계를 0으로 만든다. CircleCI 의 같은 job 도 그렇게 한다.
#    운영 빌드가 동시에 돌면 그쪽이 보고하는 적중률이 틀어진다. 숫자만 틀어지고 빌드는 멀쩡하다.

name: poc-s3

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "CUBRID/cubrid 의 40자 커밋 SHA"
        required: true
        type: string
      force:
        description: "이미 발행된 빌드가 있어도 다시 빌드한다"
        required: false
        default: false
        type: boolean

# self-hosted 를 태우는 워크플로는 최소 권한으로 둔다.
permissions:
  contents: read

jobs:
  build-debug-node:
    name: rl8.10 노드 빌드 재현
    runs-on: cubridqa-1503-poc
    timeout-minutes: 120

    container:
      image: cubridci/cubridci:rl8.10

    defaults:
      run:
        shell: bash

    env:
      # CircleCI executor cubrid-build-node 의 environment 와 같은 값이다.
      BUILD_MIRROR: /home/build-cache/cubrid-mirror
      CCACHE_DIR: /home/build-cache/ccache-shell-debug
      CCACHE_COMPILERCHECK: content
      # CCACHE_HARDLINK 는 주지 않는다. 캐시는 gluster, 빌드 트리는 pod 로컬이라
      # cross-device 다. 하드링크가 조용히 복사로 떨어진다.
      BUILD_SENTINEL: .complete
      # 운영 경로(/home/build-cache/builds)가 아니다. 위 주석 2 참조.
      POC_BUILD_ROOT: /home/build-cache/poc-1503/builds

    steps:
      # ---------------------------------------------------------------
      - name: 0. 환경 실사 — 여기서 막히면 뒤는 볼 것도 없다
        env:
          # 입력을 ${{ }} 로 셸 본문에 박지 않고 환경변수로 건넨다. 본문에 박으면
          # 입력값이 셸 코드로 해석될 수 있다. dispatch 는 maintainer 만 쏘지만
          # S4 가 세울 방어선을 여기서부터 지킨다.
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -eo pipefail
          echo "=== 정체 ==="
          echo "job pod    : $(hostname)"
          echo "runner     : ${RUNNER_NAME:-(없음)}"
          echo "workspace  : $GITHUB_WORKSPACE"
          echo "uid/gid    : $(id)"
          echo "이미지     : $(cat /etc/redhat-release)"
          echo "git        : $(git --version)"

          echo "=== 입력 SHA 검사 ==="
          # S4 의 설계 원칙을 여기서부터 지킨다: 입력은 전체 40자 SHA 다.
          # 짧은 SHA 나 ref 이름은 받지 않는다.
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha 는 소문자 40자 hex 여야 한다"
            exit 1
          fi
          echo "SHA: $INPUT_SHA"
          echo "SHA=$INPUT_SHA" >> "$GITHUB_ENV"

          echo "=== /home/build-cache 마운트 ==="
          # 진단 출력이다. 없는 경로 때문에 여기서 죽으면 아래의 설명이 안 나온다.
          ls -ld /home/build-cache "$BUILD_MIRROR" "$BUILD_MIRROR/cubrid.git" "$CCACHE_DIR" || true
          df -h /home/build-cache "$GITHUB_WORKSPACE" || true

          if [ ! -d "$BUILD_MIRROR/cubrid.git" ]; then
            echo "::error::미러가 안 보인다. pod template(훅 확장)이 job pod 에 적용되지 않았다."
            exit 1
          fi

          echo "=== 쓰기 가능한지 ==="
          # 발행 스텝에서 처음 알게 되면 30분을 버린다. 지금 확인한다.
          mkdir -p "$POC_BUILD_ROOT"
          probe="$POC_BUILD_ROOT/.write-probe.$$"
          touch "$probe" && rm -f "$probe"
          echo "쓰기 가능"

          echo "=== 미러 낡음 정도 (WAN 증분을 좌우한다) ==="
          git -C "$BUILD_MIRROR/cubrid.git" log -1 --format='%h %ci %s' develop || true

          echo "=== 작업 디렉토리 ==="
          ls -Al "$GITHUB_WORKSPACE"

      # ---------------------------------------------------------------
      - name: 1. WAN 계측기 설치 + 기준선
        run: |
          set -eo pipefail
          # pod 의 비-lo 인터페이스 rx/tx 합을 한 줄로 덧붙인다.
          # GlusterFS 는 호스트의 FUSE 마운트를 hostPath 로 받는 것이라 그 트래픽은
          # pod 의 netns 를 지나지 않는다. 그래서 여기 잡히는 것은 사실상 GitHub 왕복과
          # 3rdparty 내려받기 — 즉 WAN 이다. K8s API 와 DNS 가 조금 섞이지만 KB 단위다.
          cat > "$RUNNER_TEMP/netsnap.sh" <<'EOS'
          #!/bin/bash
          awk -v L="$1" '
            NR > 2 {
              name = $1; sub(/:.*/, "", name)
              if (name == "lo") next
              rx += $2; tx += $10
            }
            END { printf "%s\t%d\t%d\n", L, rx, tx }
          ' /proc/net/dev >> "$RUNNER_TEMP/netlog.tsv"
          tail -1 "$RUNNER_TEMP/netlog.tsv"
          EOS
          chmod +x "$RUNNER_TEMP/netsnap.sh"

          echo "=== /proc/net/dev 원본 (검증용) ==="
          cat /proc/net/dev

          echo "=== 기준선 ==="
          "$RUNNER_TEMP/netsnap.sh" 00-start

      # ---------------------------------------------------------------
      - name: 2. 이미 발행된 빌드가 있나
        id: reuse
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -eo pipefail
          # CircleCI 는 여기서 `circleci-agent step halt` 로 job 을 성공 종료한다.
          # GHA 에는 halt 가 없다. 출력 하나를 내고 뒤 스텝을 if 로 건다.
          # S6(분배·결과 수집)에서 같은 패턴이 필요하므로 여기서 형태를 잡아 둔다.
          dir="$POC_BUILD_ROOT/$SHA/debug"
          if [ "$INPUT_FORCE" = 'true' ]; then
            echo "force=true — 발행물이 있어도 다시 빌드한다"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$dir/$BUILD_SENTINEL" ]; then
            echo "이미 발행됨: $dir"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "발행물 없음 — 빌드한다"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      - name: 3. 소스 준비 — 미러에서 빌리고 증분만 WAN 으로 받는다
        if: steps.reuse.outputs.published != 'true'
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"

          # 미러에는 절대 쓰지 않는다. 공유 디렉토리의 writer 가 여럿이 되면
          # 동시 fetch 가 ref 락을 다투고, fetch 도중 pod 가 죽으면 .lock 이 남아
          # 이후 모든 빌드가 멈춘다. 이력만 빌리고(--shared) 증분은 여기서 받는다.
          if [ -d "$BUILD_MIRROR/cubrid.git" ]; then
            git clone --quiet --shared --no-checkout "$BUILD_MIRROR/cubrid.git" .
          else
            echo "[warn] 미러가 없다 — 전체 이력을 WAN 으로 받는다"
            git clone --progress --no-checkout https://github.com/CUBRID/cubrid.git .
          fi

          # shallow 금지. 빌드 번호 serial 이 git rev-list --count 라
          # shallow 면 패키지에 0001 이 찍힌다.
          git fetch --quiet https://github.com/CUBRID/cubrid.git "$SHA"
          git checkout --quiet --detach "$SHA"

          git submodule sync
          git submodule init
          # 미러가 그 커밋을 가진 서브모듈만 미러로 바꾼다. 미러 seed 이후 bump 된
          # 서브모듈은 GitHub 에서 통째로 받는다 (git submodule update 는 이미 저장소가
          # 있는 경로에 fetch 하지 않으므로 증분 구조가 성립하지 않는다).
          while read -r sub_sha sub_path; do
            url=$(git config -f .gitmodules --get "submodule.${sub_path}.url")
            mirror="$BUILD_MIRROR/$(basename "${url%.git}").git"
            if git -C "$mirror" cat-file -e "${sub_sha}^{commit}" 2>/dev/null; then
              git config "submodule.${sub_path}.url" "$mirror"
              echo "[mirror] $sub_path"
            else
              echo "[warn] $sub_path 는 미러에 없다 — GitHub 에서 전체를 받는다"
            fi
          done < <(git ls-tree HEAD | awk '$2 == "commit" { print $3, $4 }')

          # git 2.38 부터 로컬 경로에서 서브모듈을 클론하지 않는다 (CVE-2022-39253).
          git -c protocol.file.allow=always submodule update

          echo "=== 확인 ==="
          echo "HEAD        : $(git rev-parse HEAD)"
          echo "build serial: $(git rev-list --count HEAD)"
          git submodule status

          "$RUNNER_TEMP/netsnap.sh" 10-source-done

      # ---------------------------------------------------------------
      - name: 4. 빌드 — 소스 루트에서 해야 한다
        if: steps.reuse.outputs.published != 'true'
        run: |
          set -eo pipefail
          # entrypoint 의 run_build 는 build.log 를 현재 디렉토리에 쓰면서 실패 검사는
          # $CUBRID_SRCDIR/build.log 를 읽는다. 소스가 한 단계 아래면 그 경로가 없어서
          # **실패한 빌드가 성공으로 보고된다**. 소스 루트에서 돌려야 둘이 맞는다.
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          ccache -z

          # -j 를 주지 않는다. ninja 1.11.1 이 cgroup quota 를 읽어 스스로 정한다.
          /entrypoint.sh build -m optdebug

          ccache -s

          "$RUNNER_TEMP/netsnap.sh" 20-build-done

      # ---------------------------------------------------------------
      - name: 5. 발행 — staging 에 모으고 rename 한 번으로 공개한다
        if: steps.reuse.outputs.published != 'true'
        run: |
          set -eo pipefail
          dir="$POC_BUILD_ROOT/$SHA/debug"
          tmp="${dir}.tmp.${GITHUB_RUN_ID}"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cp -a /home/CUBRID "$tmp/CUBRID"
          touch "$tmp/$BUILD_SENTINEL"
          # rename 하나로 공개된다. 소비자가 반쯤 복사된 트리를 보는 일이 없다.
          if ! mv -T "$tmp" "$dir"; then
            rm -rf "$tmp"
            # 먼저 발행한 run 만 무시해도 된다. 그것은 sentinel 을 남긴다.
            # 그 밖의 mv 실패는 아무것도 발행하지 않은 것이므로 여기서 실패한다.
            test -f "$dir/$BUILD_SENTINEL"
            echo "다른 run 이 먼저 발행했다"
          fi
          du -sh "$dir"
          df -h /home/build-cache

          "$RUNNER_TEMP/netsnap.sh" 30-publish-done

      # ---------------------------------------------------------------
      - name: 6. WAN 보고
        if: always()
        run: |
          set -eo pipefail
          echo "=== /proc/net/dev 원본 (검증용) ==="
          cat /proc/net/dev

          if [ ! -f "$RUNNER_TEMP/netlog.tsv" ]; then
            echo "계측기가 돌기 전에 죽었다 — 보고할 것이 없다"
            exit 0
          fi

          "$RUNNER_TEMP/netsnap.sh" 99-end > /dev/null

          echo
          echo "=== 구간별 WAN (job pod 의 비-lo 인터페이스 누계) ==="
          awk -F'\t' '
            BEGIN { printf "%-34s %14s %14s\n", "구간", "수신", "송신" }
            {
              if (NR > 1) {
                printf "%-34s %11.2f MB %11.2f MB\n",
                  prev " -> " $1, ($2 - prx) / 1048576, ($3 - ptx) / 1048576
              } else { srx = $2; stx = $3 }
              prev = $1; prx = $2; ptx = $3
            }
            END {
              printf "%-34s %11.2f MB %11.2f MB\n", "합계",
                (prx - srx) / 1048576, (ptx - stx) / 1048576
            }
          ' "$RUNNER_TEMP/netlog.tsv"

          echo
          echo "=== 원자료 ==="
          cat "$RUNNER_TEMP/netlog.tsv"
          echo
          echo "비교 기준 (CUBRIDQA-1506 의 CircleCI 노드 빌드):"
          echo "  git 증분 약 2MB (미러 7일 낡음) + 3rdparty 약 17MB"
          echo "  이 값이 대체한 것: 아티팩트 290MB"

      # ---------------------------------------------------------------
      - name: 7. 빌드 로그 — 실패했을 때 유일한 단서다
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/build.log"
          if [ -f "$f" ]; then
            echo "=== build.log 끝 200줄 ==="
            tail -200 "$f"
          else
            echo "build.log 없음"
          fi
