name: Context Debugger

# 트리거 설정: 
# 1. issue_comment: 댓글 달았을 때 (사용자님의 주 목적)
# 2. pull_request: PR이 생성/수정되었을 때 (비교 확인용)
# 3. workflow_dispatch: Actions 탭에서 수동 실행 가능 (디버깅용)
on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  debug_context:
    name: Dump Context
    runs-on: ubuntu-latest
    steps:
      # Step 1: 체크아웃 (선택 사항이지만 보통 기본으로 넣음)
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: 사용자님이 요청하신 로그 출력 부분
      # steps 레벨 아래에 들여쓰기 되어 있고, '-'로 시작하는 것이 올바른 문법입니다.
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
